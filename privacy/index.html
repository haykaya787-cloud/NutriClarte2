<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="container">
    <!-- Upper Right Language Toggle -->
    <div class="language-toggle">
      <label for="lang-select" class="sr-only">Select Language</label>
      <select id="lang-select" onchange="switchLanguage(this.value)">
        <option value="en">English 🇬🇧</option>
        <option value="fr">Français 🇫🇷</option>
        <option value="es">Español 🇪🇸</option>
      </select>
    </div>

    <!-- Content with translation tags -->
    <h1 data-data-i18n="privacy_title">Privacy Policy</h1>
    <p data-data-i18n="privacy_desc">Your privacy is important to us. This page outlines how we collect, use, and protect your information.</p>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
