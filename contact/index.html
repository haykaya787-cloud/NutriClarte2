<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="container">
    <!-- Upper Right Language Toggle -->
    <div class="language-toggle">
      <label for="lang-select" class="sr-only">Select Language</label>
      <select id="lang-select" onchange="switchLanguage(this.value)">
        <option value="en">English 🇬🇧</option>
        <option value="fr">Français 🇫🇷</option>
        <option value="es">Español 🇪🇸</option>
      </select>
    </div>

    <!-- Content with translation tags -->
    <h1 data-data-i18n="contact_title">Contact Us</h1>
    <p data-data-i18n="contact_desc">Have questions? Fill out the form below to get in touch with our team.</p>

    <form action="#" method="post">
      <div class="form-group">
        <label for="name" data-data-i18n="label_name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your full name">
      </div>

      <div class="form-group">
        <label for="email" data-data-i18n="label_email">Email</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="message" data-data-i18n="label_message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" data-data-i18n="btn_submit">Send Message</button>
    </form>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
